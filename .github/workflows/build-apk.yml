name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Add Firebase config (if provided)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Update Gradle wrapper to 8.3
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get

      - name: Patch plugins missing namespace
        run: |
          python3 - <<'PY'
          import re, glob, os
          root = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          for gf in glob.glob(root + "/hosted/*/*/android/build.gradle"):
              s = open(gf).read()
              if "namespace" in s:
                  continue
              mf = os.path.join(os.path.dirname(gf), "src/main/AndroidManifest.xml")
              if not os.path.exists(mf):
                  continue
              m = re.search(r'package="([^"]+)"', open(mf).read())
              if not m:
                  continue
              s2 = re.sub(r"(\nandroid\s*\{)", lambda x: x.group(1) + '\n    namespace "' + m.group(1) + '"', s, count=1)
              if s2 != s:
                  open(gf, "w").write(s2)
                  print("patched", gf, m.group(1))
          PY

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hayaa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
