name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: hayaa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure and report Android signing certificate
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.19.6"
          cache: true

      - name: Add Firebase config (if provided)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Verify Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          project_id = config.get("project_info", {}).get("project_id")
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if project_id != "voice-up-84ee1":
              raise SystemExit(f"Wrong Firebase project: {project_id!r}")
          if "com.egycode.hayaa" not in packages:
              raise SystemExit("Firebase config does not contain com.egycode.hayaa")
          print("Firebase project and Android package verified.")
          PY
          ACTUAL_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | awk -F': ' '/SHA1:/{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA1=$(python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          for client in config.get("client", []):
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.egycode.hayaa":
                  for oauth in client.get("oauth_client", []):
                      info = oauth.get("android_info", {})
                      if info.get("package_name") == "com.egycode.hayaa":
                          print(info.get("certificate_hash", "").replace(":", "").lower())
                          raise SystemExit
          PY
          )
          echo "Build signing SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::warning::Build signing SHA-1 does not match Firebase Google OAuth SHA-1. Google sign-in may fail until the matching keystore is configured."
          else
            echo "Build signing SHA-1 matches Firebase."
          fi

      - name: Update Gradle wrapper to 8.3
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Patch plugins (namespace + JVM target)
        run: |
          python3 - <<'PY'
          import re, glob, os
          root = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          for gf in glob.glob(root + "/hosted/*/*/android/build.gradle"):
              s = open(gf).read()
              orig = s
              mf = os.path.join(os.path.dirname(gf), "src/main/AndroidManifest.xml")

              # 1) add namespace if missing
              if "namespace" not in s and os.path.exists(mf):
                  m = re.search(r'package="([^"]+)"', open(mf).read())
                  if m:
                      s = re.sub(r"(\nandroid\s*\{)",
                                 lambda x: x.group(1) + '\n    namespace "' + m.group(1) + '"',
                                 s, count=1)

              # 2) align Java/Kotlin JVM target to 17, only for plugins that really apply the Kotlin plugin
              uses_kotlin = re.search(r"kotlin-android|org\.jetbrains\.kotlin\.android", s)
              if uses_kotlin and "JVM_TARGET_PATCH" not in s:
                  s += '''
          // JVM_TARGET_PATCH
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          '''
              if s != orig:
                  open(gf, "w").write(s)
                  print("patched", gf)
          PY

      - name: Fix flutter_local_notifications bigLargeIcon ambiguity
        run: |
          f=$(find "$PUB_CACHE/hosted" -path "*flutter_local_notifications-*" -name FlutterLocalNotificationsPlugin.java)
          for x in $f; do
            sed -i 's/bigPictureStyle\.bigLargeIcon(null);/bigPictureStyle.bigLargeIcon((android.graphics.Bitmap) null);/' "$x"
            grep -n "bigLargeIcon" "$x"
          done

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: hayaa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
